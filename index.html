<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DM Dashboard · Store Operations</title>
    <!-- Modern system fonts + smooth rendering -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-muted: #475569;
            --text-soft: #64748b;
            --border: #e2e8f0;
            --success: #166534;
            --success-bg: #dcfce7;
            --danger: #991b1b;
            --danger-bg: #fee2e2;
            --warning: #b45309;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
            --radius-lg: 1rem;
            --radius-md: 0.75rem;
        }

        body {
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            padding: 20px 16px 32px;
            min-height: 100vh;
        }

        /* Main container */
        .app-container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* Tabs - Normal Flow (No longer sticky) */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            background: var(--bg);
            padding: 4px 0 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            min-width: 140px;
            padding: 12px 20px;
            border: none;
            border-radius: 40px;
            background: #e2e8f0;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* Section cards */
        .section-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.75rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: box-shadow 0.2s;
        }

        .section-card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.6rem;
        }

        .card-header h3 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.2px;
        }

        .badge-deadline {
            background: #fee2e2;
            color: var(--danger);
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 40px;
        }

        /* Form grid layout */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .field-group label {
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-soft);
        }

        .field-group input,
        .field-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.9rem;
            background: white;
            transition: all 0.18s;
            font-family: inherit;
        }

        .field-group input:focus,
        .field-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .inline-time {
            display: flex;
            gap: 12px;
            background: #f9fafc;
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .inline-time .field-group {
            flex: 1;
            margin-bottom: 0;
        }

        .divider-mini {
            margin: 1rem 0 0.8rem;
            border-top: 1px dashed var(--border);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Slot bar (dashboard) - Normal Flow */
        .slot-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            background: white;
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        /* Date Picker Styling */
        .date-input {
            padding: 8px 16px;
            border: 1.5px solid var(--primary-light);
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-dark);
            background: var(--primary-light);
            outline: none;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .date-input:focus, .date-input:hover {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .slot-divider {
            width: 2px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }

        .nav-arrow {
            background: #f1f5f9;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-muted);
        }

        .nav-arrow:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }

        .nav-arrow:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .slot-label {
            font-weight: 800;
            font-size: 1.2rem;
            background: var(--primary-light);
            padding: 6px 20px;
            border-radius: 40px;
            color: var(--primary);
        }

        .slot-dots {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .slot-dot {
            width: 8px;
            height: 8px;
            background: #cbd5e1;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .slot-dot.active {
            background: var(--primary);
            width: 20px;
        }

        /* KPI cards - Normal Flow */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .kpi-card {
            background: white;
            border-radius: 20px;
            padding: 16px 14px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .kpi-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.6px;
            color: var(--text-soft);
            margin-bottom: 8px;
        }

        .kpi-val {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.2;
            color: var(--text);
        }

        .kpi-val.good { color: var(--success); }
        .kpi-val.bad { color: var(--danger); }

        /* Table wrapper - Internally scrollable */
        .table-wrapper {
            background: white;
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow-x: auto;
            overflow-y: auto;
            max-height: 65vh; /* Gives the table its own scrollbar */
            box-shadow: var(--shadow-sm);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 680px;
        }

        .data-table th {
            background: #f8fafc;
            padding: 14px 12px;
            text-align: center;
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-soft);
            
            /* Sticky Table Headings so you don't lose context inside the table */
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: inset 0 -1.5px 0 var(--border);
        }

        .data-table td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
            font-weight: 500;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        /* Top-Left Corner */
        .data-table th:first-child {
            left: 0;
            z-index: 12;
        }

        /* Leftmost Store Column Sticky */
        .data-table td:first-child {
            text-align: left;
            font-weight: 700;
            position: sticky;
            left: 0;
            background: white;
            z-index: 2;
            box-shadow: 2px 0 4px rgba(0,0,0,0.02);
        }

        .badge-store {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: monospace;
        }

        .badge-success {
            background: var(--success-bg);
            color: var(--success);
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
        }

        .badge-danger {
            background: var(--danger-bg);
            color: var(--danger);
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
        }

        .store-name-mini {
            font-size: 0.65rem;
            color: var(--text-soft);
            display: block;
            margin-top: 3px;
            font-weight: normal;
        }

        .good { color: var(--success) !important; font-weight: 800; }
        .bad { color: var(--danger) !important; font-weight: 800; }

        /* loading */
        .loader {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 32px;
            color: var(--text-soft);
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast-notify {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            transform: translateY(80px);
            opacity: 0;
            transition: 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 999;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .toast-notify.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .kpi-val { font-size: 1.3rem; }
            .slot-bar { border-radius: 30px; }
            .form-grid { grid-template-columns: 1fr; }
            .table-wrapper { max-height: 55vh; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" id="tabFormBtn">📋 ENTRY FORM</button>
        <button class="tab-btn" id="tabDashBtn">📊 DASHBOARD</button>
    </div>

    <!-- Form Tab -->
    <div id="formTab" class="tab-content active">
        <div class="section-card">
            <div class="card-header">
                <h3>📌 Store Metrics Submission</h3>
                <span class="badge-deadline">Real‑time update</span>
            </div>
            <form id="metricsForm">
                <div class="form-grid">
                    <div class="field-group">
                        <label>🏬 Store Code</label>
                        <select id="storeSelect" required>
                            <option value="">-- Select store --</option>
                            <option>TM6N</option><option>TM4T</option><option>TM6M</option><option>T9W3</option>
                            <option>T9T3</option><option>T9V5</option><option>T3GC</option><option>TM6O</option>
                            <option>T9T7</option><option>TM4Z</option><option>TM3J</option><option>TM5C</option>
                            <option>TN1B</option><option>TK5T</option><option>TN1T</option><option>T9H8</option>
                            <option>TM8T</option><option>TN1C</option><option>TBAE</option><option>U2JH</option>
                            <option>U1WR</option><option>U949</option><option>FRVE</option><option>U286</option>
                            <option>U1WP</option><option>2314</option><option>3035</option><option>3087</option>
                            <option>F1ZP</option><option>U1L2</option><option>U14V</option><option>TNI6</option>
                            <option>U086</option><option>U1OW</option><option>TKM7</option>
                        </select>
                    </div>
                </div>

                <div class="divider-mini"></div>
                <div class="form-grid">
                    <div class="field-group"><label>📦 Total Orders</label><input type="number" id="totalOrders" placeholder="0"></div>
                    <div class="field-group"><label>🔄 Open Orders</label><input type="number" id="openOrders" placeholder="0"></div>
                    <div class="field-group"><label>❌ Cancelled</label><input type="number" id="cancelledOrders" placeholder="0"></div>
                </div>

                <div class="form-grid">
                    <div class="field-group"><label>📊 FFO (%)</label><input type="number" id="ffo" step="any" placeholder="e.g., 96.5"></div>
                </div>

                <!-- OTI / ITR / OTD with H/M/S -->
                <div class="card-header" style="margin-top: 0.5rem;"><h3 style="font-size: 0.9rem;">⏱️ Time Metrics (HH:MM:SS)</h3></div>
                
                <div class="field-group"><label>🕒 OTI (Order → Invoice)</label>
                    <div class="inline-time">
                        <div class="field-group"><label>H</label><input type="number" id="otiH" placeholder="0" min="0"></div>
                        <div class="field-group"><label>M</label><input type="number" id="otiM" placeholder="0" min="0" max="59"></div>
                        <div class="field-group"><label>S</label><input type="number" id="otiS" placeholder="0" min="0" max="59"></div>
                    </div>
                </div>

                <div class="field-group"><label>🕒 ITR (Invoice → Rider)</label>
                    <div class="inline-time">
                        <div class="field-group"><label>H</label><input type="number" id="itrH" placeholder="0" min="0"></div>
                        <div class="field-group"><label>M</label><input type="number" id="itrM" placeholder="0" min="0" max="59"></div>
                        <div class="field-group"><label>S</label><input type="number" id="itrS" placeholder="0" min="0" max="59"></div>
                    </div>
                </div>

                <div class="field-group"><label>🕒 OTD (Order → Delivery)</label>
                    <div class="inline-time">
                        <div class="field-group"><label>H</label><input type="number" id="otdH" placeholder="0" min="0"></div>
                        <div class="field-group"><label>M</label><input type="number" id="otdM" placeholder="0" min="0" max="59"></div>
                        <div class="field-group"><label>S</label><input type="number" id="otdS" placeholder="0" min="0" max="59"></div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">✓ SUBMIT METRICS →</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Tab -->
    <div id="dashTab" class="tab-content">
        <!-- slot controls with Date Filter -->
        <div class="slot-bar">
            <!-- Date Input -->
            <input type="date" id="dateSelect" class="date-input">
            <div class="slot-divider"></div>
            
            <button class="nav-arrow" id="prevSlotBtn">←</button>
            <span class="slot-label" id="slotRangeLabel">—</span>
            <div class="slot-dots" id="slotDotsContainer"></div>
            <button class="nav-arrow" id="nextSlotBtn">→</button>
        </div>

        <!-- KPI row -->
        <div id="kpiGrid" class="kpi-row">
            <div class="loader"><div class="spinner"></div> loading KPIs...</div>
        </div>

        <!-- stores table card -->
        <div class="table-wrapper">
            <table class="data-table" id="storeTable">
                <thead>
                    <tr>
                        <th>Store</th><th>Total</th><th>Open</th><th>Cancel</th><th>FFO %</th><th>OTI</th><th>ITR</th><th>OTD</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="8"><div class="loader"><div class="spinner"></div> Syncing data...</div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div id="globalToast" class="toast-notify">✓ Report submitted</div>

<script>
    // ---------- CONFIG ----------
    const API_URL = "https://script.google.com/macros/s/AKfycbyG9EJNzonUT15CrbhPtCZuYPdR0e86sVQa6fi82JjN6oBbDW56IVR5TlmjIq7NKJm8/exec";
    const STORES_LIST = [
        "TM6N","TM4T","TM6M","T9W3","T9T3","T9V5","T3GC","TM6O","T9T7",
        "TM4Z","TM3J","TM5C","TN1B","TK5T","TN1T","T9H8","TM8T","TN1C",
        "TBAE","U2JH","U1WR","U949","FRVE","U286","U1WP","2314","3035",
        "3087","F1ZP","U1L2","U14V","TNI6","U086","U1OW","TKM7"
    ];
    const SLOTS = [[8,10],[10,12],[12,14],[14,16],[16,18],[18,20],[20,22]];
    let currentSlotIdx = 0;
    let allRecords = [];           // raw data from API
    let isLoadingDashboard = false;

    // helper: seconds from h/m/s
    function toSeconds(h,m,s) { return (parseInt(h)||0)*3600 + (parseInt(m)||0)*60 + (parseInt(s)||0); }
    
    // helper: format seconds into MM:SS format, returns blank string if no data
    function formatMMSS(sec) { 
        if(sec === null || isNaN(sec)) return ""; 
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`; 
    }

    // Set Date Filter to Today on load
    function setDefaultDate() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('dateSelect').value = `${yyyy}-${mm}-${dd}`;
    }

    // set initial slot based on current hour
    function setSlotByHour() {
        const now = new Date().getHours();
        let found = 0;
        for(let i=0; i<SLOTS.length; i++) {
            if(now >= SLOTS[i][0] && now < SLOTS[i][1]) { found = i; break; }
        }
        currentSlotIdx = found;
    }

    // render slot dots & labels
    function renderSlotControls() {
        const container = document.getElementById('slotDotsContainer');
        if(!container) return;
        container.innerHTML = SLOTS.map((_,i) => `<div class="slot-dot ${i===currentSlotIdx ? 'active' : ''}" data-slotidx="${i}"></div>`).join('');
        document.querySelectorAll('.slot-dot').forEach(dot => {
            dot.addEventListener('click', (e) => {
                const idx = parseInt(e.currentTarget.dataset.slotidx);
                if(!isNaN(idx)) { 
                    currentSlotIdx = idx; 
                    renderSlotControls(); 
                    renderDashboardUI(); // Render instantly without fetching
                }
            });
        });
        const [s,e] = SLOTS[currentSlotIdx];
        document.getElementById('slotRangeLabel').innerText = `${s}:00 – ${e}:00`;
        const prevBtn = document.getElementById('prevSlotBtn');
        const nextBtn = document.getElementById('nextSlotBtn');
        if(prevBtn) prevBtn.disabled = (currentSlotIdx === 0);
        if(nextBtn) nextBtn.disabled = (currentSlotIdx === SLOTS.length-1);
    }

    // fetch data from API
    async function fetchAllMetrics() {
        try {
            const response = await fetch(API_URL);
            const raw = await response.text();
            let data = [];
            try { data = JSON.parse(raw); } catch(e) { console.warn("parse",e); data = []; }
            return Array.isArray(data) ? data : [];
        } catch(err) {
            console.error("fetch error", err);
            return [];
        }
    }

    // Filter records by BOTH current date and current slot
    function filterRecordsBySlot(records, slotIdx) {
        const selectedDate = document.getElementById('dateSelect').value; // format: 'YYYY-MM-DD'
        const [startH, endH] = SLOTS[slotIdx];
        
        return records.filter(rec => {
            if(!rec.timestamp) return false;
            
            let dateObj = new Date(rec.timestamp);
            if(isNaN(dateObj.getTime())) {
                // fallback: try to replace space
                dateObj = new Date(rec.timestamp.replace(' ','T'));
            }

            // 1. Check Date Match
            const recYear = dateObj.getFullYear();
            const recMonth = String(dateObj.getMonth() + 1).padStart(2, '0');
            const recDay = String(dateObj.getDate()).padStart(2, '0');
            const recordDateStr = `${recYear}-${recMonth}-${recDay}`;
            
            if(recordDateStr !== selectedDate) return false;

            // 2. Check Time Slot Match
            const hour = dateObj.getHours();
            return hour >= startH && hour < endH;
        });
    }

    // aggregate data per store for current slot
    function aggregateByStore(recordsInSlot) {
        const storeMap = new Map(); // store -> aggregated values
        for(const rec of recordsInSlot) {
            const store = rec.store;
            if(!store) continue;
            if(!storeMap.has(store)) {
                storeMap.set(store, {
                    total_orders: null, open_orders: null, cancelled_orders: null, ffo: null,
                    oti: null, itr: null, otd: null, countFFO:0, countOTI:0, countITR:0, countOTD:0
                });
            }
            let agg = storeMap.get(store);
            if(rec.total_orders !== undefined && rec.total_orders !== null) agg.total_orders = rec.total_orders;
            if(rec.open_orders !== undefined && rec.open_orders !== null) agg.open_orders = rec.open_orders;
            if(rec.cancelled_orders !== undefined && rec.cancelled_orders !== null) agg.cancelled_orders = rec.cancelled_orders;
            
            if(rec.ffo !== undefined && rec.ffo !== null) { agg.ffo = rec.ffo; agg.countFFO++; }
            if(rec.oti !== undefined && rec.oti !== null) { agg.oti = rec.oti; agg.countOTI++; }
            if(rec.itr !== undefined && rec.itr !== null) { agg.itr = rec.itr; agg.countITR++; }
            if(rec.otd !== undefined && rec.otd !== null) { agg.otd = rec.otd; agg.countOTD++; }
        }
        return storeMap;
    }

    // compute global KPIs (slot aggregated)
    function computeGlobalKpis(storeAggMap) {
        let totalOrd = 0, totalOpen = 0, totalCancel = 0;
        let ffoSum = 0, ffoCount = 0;
        let otiSum = 0, otiCount = 0;
        let itrSum = 0, itrCount = 0;
        let otdSum = 0, otdCount = 0;
        for(const agg of storeAggMap.values()) {
            if(agg.total_orders) totalOrd += agg.total_orders;
            if(agg.open_orders) totalOpen += agg.open_orders;
            if(agg.cancelled_orders) totalCancel += agg.cancelled_orders;
            if(agg.ffo !== null && agg.ffo !== undefined) { ffoSum += agg.ffo; ffoCount++; }
            if(agg.oti !== null) { otiSum += agg.oti; otiCount++; }
            if(agg.itr !== null) { itrSum += agg.itr; itrCount++; }
            if(agg.otd !== null) { otdSum += agg.otd; otdCount++; }
        }
        return {
            totalOrders: totalOrd,
            openOrders: totalOpen,
            cancelled: totalCancel,
            avgFfo: ffoCount ? (ffoSum/ffoCount) : null,
            avgOti: otiCount ? (otiSum/otiCount) : null,
            avgItr: itrCount ? (itrSum/itrCount) : null,
            avgOtd: otdCount ? (otdSum/otdCount) : null,
        };
    }

    function statusClass(value, type) {
        if(value === null || value === undefined || value === "") return '';
        if(type === 'ffo') return value > 95 ? 'good' : (value < 85 ? 'bad' : '');
        if(type === 'oti') return value < 7200 ? 'good' : 'bad';   // <2h good
        if(type === 'itr') return value < 3600 ? 'good' : 'bad';   // <1h good
        if(type === 'otd') return value < 10800 ? 'good' : 'bad';  // <3h good
        return '';
    }

    // NEW FUNCTION: Purely renders the UI based on existing allRecords data (Instantaneous)
    function renderDashboardUI() {
        if(!document.getElementById('dashTab').classList.contains('active')) return;

        const slotFiltered = filterRecordsBySlot(allRecords, currentSlotIdx);
        const storeAgg = aggregateByStore(slotFiltered);
        const kpis = computeGlobalKpis(storeAgg);
        
        // Render KPI grid - Replaced dashes with empty strings
        const kpiElements = [
            { label: "Total Orders", value: kpis.totalOrders || 0, raw: null, type: null },
            { label: "Open Orders", value: kpis.openOrders || 0, raw: null },
            { label: "Cancelled", value: kpis.cancelled || 0, raw: null },
            { label: "Avg FFO", value: kpis.avgFfo ? kpis.avgFfo.toFixed(1)+"%" : "", raw: kpis.avgFfo, type: "ffo" },
            { label: "Avg OTI", value: kpis.avgOti ? formatMMSS(kpis.avgOti) : "", raw: kpis.avgOti, type: "oti" },
            { label: "Avg ITR", value: kpis.avgItr ? formatMMSS(kpis.avgItr) : "", raw: kpis.avgItr, type: "itr" },
            { label: "Avg OTD", value: kpis.avgOtd ? formatMMSS(kpis.avgOtd) : "", raw: kpis.avgOtd, type: "otd" }
        ];
        document.getElementById('kpiGrid').innerHTML = kpiElements.map(k => {
            const cls = k.type ? statusClass(k.raw, k.type) : '';
            return `<div class="kpi-card"><div class="kpi-label">${k.label}</div><div class="kpi-val ${cls}">${k.value}</div></div>`;
        }).join('');
        
        // Build table rows
        const rowsHtml = STORES_LIST.map(storeCode => {
            const agg = storeAgg.get(storeCode) || {};
            
            // Check for both null and undefined properly
            const total = agg.total_orders != null ? agg.total_orders : '';
            const open = agg.open_orders != null ? agg.open_orders : '';
            const cancel = agg.cancelled_orders != null ? agg.cancelled_orders : '';
            let ffoVal = agg.ffo != null ? agg.ffo : null;
            let otiVal = agg.oti || null;
            let itrVal = agg.itr || null;
            let otdVal = agg.otd || null;
            
            const ffoDisplay = ffoVal !== null ? ffoVal.toFixed(1)+"%" : "";
            const otiDisplay = otiVal ? formatMMSS(otiVal) : "";
            const itrDisplay = itrVal ? formatMMSS(itrVal) : "";
            const otdDisplay = otdVal ? formatMMSS(otdVal) : "";
            
            const ffoClass = statusClass(ffoVal, 'ffo');
            const otiClass = statusClass(otiVal, 'oti');
            const itrClass = statusClass(itrVal, 'itr');
            const otdClass = statusClass(otdVal, 'otd');
            
            return `<tr>
                        <td><span class="badge-store">${storeCode}</span></td>
                        <td>${total}</td>
                        <td>${open}</td>
                        <td>${cancel}</td>
                        <td class="${ffoClass}">${ffoDisplay}</td>
                        <td class="${otiClass}">${otiDisplay}</td>
                        <td class="${itrClass}">${itrDisplay}</td>
                        <td class="${otdClass}">${otdDisplay}</td>
                    </tr>`;
        }).join('');
        document.getElementById('tableBody').innerHTML = rowsHtml || '<tr><td colspan="8">No data for this slot/date</td></tr>';
    }

    // FUNCTION: Fetches data, shows loading spinner, then calls render (Used on Tab switch)
    async function loadDashboardData() {
        if(!document.getElementById('dashTab').classList.contains('active')) return;
        if(isLoadingDashboard) return;
        
        isLoadingDashboard = true;
        document.getElementById('kpiGrid').innerHTML = '<div class="loader"><div class="spinner"></div> refreshing KPIs...</div>';
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="8"><div class="loader"><div class="spinner"></div> loading stores...</div></td></tr>';
        
        const freshData = await fetchAllMetrics();
        if(freshData.length) allRecords = freshData;
        
        renderDashboardUI();
        isLoadingDashboard = false;
    }

    // submit form
    async function submitMetrics(ev) {
        ev.preventDefault();
        const store = document.getElementById('storeSelect').value;
        if(!store) { alert("Please select a store"); return; }
        const total_orders = parseInt(document.getElementById('totalOrders').value) || null;
        const open_orders = parseInt(document.getElementById('openOrders').value) || null;
        const cancelled_orders = parseInt(document.getElementById('cancelledOrders').value) || null;
        const ffo = parseFloat(document.getElementById('ffo').value) || null;
        const oti = toSeconds(document.getElementById('otiH').value, document.getElementById('otiM').value, document.getElementById('otiS').value);
        const itr = toSeconds(document.getElementById('itrH').value, document.getElementById('itrM').value, document.getElementById('itrS').value);
        const otd = toSeconds(document.getElementById('otdH').value, document.getElementById('otdM').value, document.getElementById('otdS').value);
        
        const payload = { store, total_orders, open_orders, cancelled_orders, ffo, oti, itr, otd };
        try {
            const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            if(response.ok) {
                const toast = document.getElementById('globalToast');
                toast.innerText = "✓ Report submitted for " + store;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
                document.getElementById('metricsForm').reset();
                
                // Refresh dashboard data silently if visible
                if(document.getElementById('dashTab').classList.contains('active')) {
                    const freshData = await fetchAllMetrics();
                    if(freshData.length) allRecords = freshData;
                    renderDashboardUI();
                }
            } else throw new Error();
        } catch(error) {
            alert("Submission error, please check network");
        }
    }

    // tab switching logic
    function setupTabs() {
        const formBtn = document.getElementById('tabFormBtn');
        const dashBtn = document.getElementById('tabDashBtn');
        const formTab = document.getElementById('formTab');
        const dashTab = document.getElementById('dashTab');
        
        formBtn.addEventListener('click', () => {
            formBtn.classList.add('active');
            dashBtn.classList.remove('active');
            formTab.classList.add('active');
            dashTab.classList.remove('active');
        });
        
        dashBtn.addEventListener('click', async () => {
            dashBtn.classList.add('active');
            formBtn.classList.remove('active');
            dashTab.classList.add('active');
            formTab.classList.remove('active');
            setSlotByHour();
            renderSlotControls();
            await loadDashboardData();
        });
    }

    // Auto-refresh: Quietly check for changes without disturbing the UI
    let intervalId = null;
    function startAutoRefresh() {
        if(intervalId) clearInterval(intervalId);
        intervalId = setInterval(async () => {
            if(document.getElementById('dashTab').classList.contains('active')) {
                // Fetch silently in the background
                const freshData = await fetchAllMetrics();
                
                if(freshData.length) {
                    // Compare the old data to the new data
                    const currentDataStr = JSON.stringify(allRecords);
                    const freshDataStr = JSON.stringify(freshData);

                    // ONLY update the screen if the data actually changed
                    if(currentDataStr !== freshDataStr) {
                        allRecords = freshData;
                        renderDashboardUI(); // Updates instantly, no loading spinners!
                    }
                }
            }
        }, 32000);
    }

    async function init() {
        setDefaultDate(); // Set date picker to today
        setupTabs();
        document.getElementById('metricsForm').addEventListener('submit', submitMetrics);
        setSlotByHour();
        renderSlotControls();
        
        // Listeners for slot and date changes
        document.getElementById('dateSelect').addEventListener('change', renderDashboardUI);
        
        document.getElementById('prevSlotBtn').addEventListener('click', () => { 
            if(currentSlotIdx > 0) { 
                currentSlotIdx--; 
                renderSlotControls(); 
                renderDashboardUI(); 
            } 
        });
        document.getElementById('nextSlotBtn').addEventListener('click', () => { 
            if(currentSlotIdx < SLOTS.length-1) { 
                currentSlotIdx++; 
                renderSlotControls(); 
                renderDashboardUI(); 
            } 
        });

        // Initial Data Fetch
        allRecords = await fetchAllMetrics();
        startAutoRefresh();
        
        if(document.getElementById('dashTab').classList.contains('active')) {
            renderDashboardUI();
        }
    }
    init();
</script>
