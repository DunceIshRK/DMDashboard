<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DM Dashboard · Store SLA Tracking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #eff6ff;
            --bg: #f8fafc; --surface: #ffffff; --text: #1e293b; --text-muted: #475569;
            --text-soft: #64748b; --border: #e2e8f0; --success: #166534; --success-bg: #dcfce7;
            --danger: #991b1b; --danger-bg: #fee2e2; --warning: #b45309;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
            --radius-lg: 1rem; --radius-md: 0.75rem;
        }
        body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); padding: 20px 16px 32px; min-height: 100vh; }
        .app-container { max-width: 1440px; margin: 0 auto; }
        .tabs { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
        .tab-btn { flex: 1; min-width: 140px; padding: 12px 20px; border: none; border-radius: 40px; background: #e2e8f0; font-weight: 700; font-size: 0.95rem; color: var(--text-muted); cursor: pointer; transition: all 0.2s; font-family: inherit; letter-spacing: 0.3px; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 8px 18px rgba(37,99,235,0.25); }
        .tab-content { display: none; animation: fadeIn 0.2s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
        .section-card { background: var(--surface); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.75rem; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .card-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.25rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 0.6rem; }
        .card-header h3 { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
        .badge-deadline { background: #fee2e2; color: var(--danger); font-size: 0.7rem; font-weight: 800; padding: 4px 12px; border-radius: 40px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; }
        .field-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .field-group label { font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-soft); }
        .field-group input, .field-group select { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 0.9rem; background: white; font-family: inherit; }
        .inline-time { display: flex; gap: 12px; background: #f9fafc; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--border); }
        .divider-mini { margin: 1rem 0 0.8rem; border-top: 1px dashed var(--border); }
        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 60px; font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 0.5rem; box-shadow: 0 6px 14px rgba(37,99,235,0.25); }
        .btn-submit:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
        .slot-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; background: white; padding: 12px 20px; border-radius: 60px; margin-bottom: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .date-input { padding: 8px 16px; border: 1.5px solid var(--primary-light); border-radius: 40px; font-size: 0.95rem; font-weight: 700; color: var(--primary-dark); background: var(--primary-light); outline: none; cursor: pointer; font-family: inherit; }
        .slot-divider { width: 2px; height: 24px; background: var(--border); margin: 0 4px; }
        .nav-arrow { background: #f1f5f9; border: none; width: 38px; height: 38px; border-radius: 30px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: all 0.2s; color: var(--text-muted); }
        .nav-arrow:hover:not(:disabled) { background: var(--primary); color: white; }
        .nav-arrow:disabled { opacity: 0.4; cursor: not-allowed; }
        .slot-label { font-weight: 800; font-size: 1.2rem; background: var(--primary-light); padding: 6px 20px; border-radius: 40px; color: var(--primary); }
        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .kpi-card { background: white; border-radius: 20px; padding: 16px 14px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .kpi-label { font-size: 0.7rem; text-transform: uppercase; font-weight: 800; letter-spacing: 0.6px; color: var(--text-soft); margin-bottom: 8px; }
        .kpi-val { font-size: 1.8rem; font-weight: 800; line-height: 1.2; color: var(--text); }
        .kpi-val.good { color: var(--success); } .kpi-val.bad { color: var(--danger); }
        .table-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .filter-toggle { font-size: 0.85rem; font-weight: 700; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px; background: white; padding: 6px 14px; border-radius: 40px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .table-wrapper { background: white; border-radius: 20px; border: 1px solid var(--border); overflow: auto; max-height: 65vh; box-shadow: var(--shadow-sm); }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 680px; }
        .data-table th { background: #f8fafc; padding: 14px 12px; text-align: center; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-soft); position: sticky; top: 0; z-index: 10; }
        .data-table td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #f1f5f9; font-weight: 500; }
        .badge-store { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 5px 12px; border-radius: 40px; font-size: 0.75rem; font-weight: 700; font-family: monospace; }
        .status-icon { font-size: 1.1rem; }
        .loader { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 32px; color: var(--text-soft); }
        .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast-notify { position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: white; padding: 12px 24px; border-radius: 60px; font-weight: 600; font-size: 0.8rem; transform: translateY(80px); opacity: 0; transition: 0.25s cubic-bezier(0.2,0.9,0.4,1.1); z-index: 999; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .toast-notify.show { transform: translateY(0); opacity: 1; }
        @media (max-width: 640px) { body { padding: 12px; } .kpi-val { font-size: 1.3rem; } .slot-bar { border-radius: 30px; } .form-grid { grid-template-columns: 1fr; } .table-wrapper { max-height: 55vh; } }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" id="tabFormBtn">📋 ENTRY FORM</button>
        <button class="tab-btn" id="tabDashBtn">📊 SLOT DASHBOARD</button>
        <button class="tab-btn" id="tabDailyBtn">📅 DAILY TRACKER</button>
    </div>

    <!-- FORM TAB -->
    <div id="formTab" class="tab-content active">
        <div class="section-card">
            <div class="card-header">
                <h3>📌 Store Metrics Submission</h3>
                <span class="badge-deadline" id="windowBadge">⏳ Closed</span>
            </div>
            <div id="submissionMessage" style="margin-bottom: 1rem; font-weight: 600; color: var(--danger);"></div>
            <form id="metricsForm">
                <div class="form-grid">
                    <div class="field-group">
                        <label>🏬 Store Code</label>
                        <select id="storeSelect" required>
                            <option value="">-- Select store --</option>
                            <option>TM6N</option><option>TM4T</option><option>TM6M</option><option>T9W3</option>
                            <option>T9T3</option><option>T9V5</option><option>T3GC</option><option>TM6O</option>
                            <option>T9T7</option><option>TM4Z</option><option>TM3J</option><option>TM5C</option>
                            <option>TN1B</option><option>TK5T</option><option>TN1T</option><option>T9H8</option>
                            <option>TM8T</option><option>TN1C</option><option>TBAE</option><option>U2JH</option>
                            <option>U1WR</option><option>U949</option><option>FRVE</option><option>U286</option>
                            <option>U1WP</option><option>2314</option><option>3035</option><option>3087</option>
                            <option>F1ZP</option><option>U1L2</option><option>U14V</option><option>TNI6</option>
                            <option>U086</option><option>U1OW</option><option>TKM7</option>
                        </select>
                    </div>
                </div>
                <div class="divider-mini"></div>
                <div class="form-grid">
                    <div class="field-group"><label>📦 Total Orders</label><input type="number" id="totalOrders" placeholder="0" required></div>
                    <div class="field-group"><label>🔄 Open Orders</label><input type="number" id="openOrders" placeholder="0" required></div>
                    <div class="field-group"><label>❌ Cancelled</label><input type="number" id="cancelledOrders" placeholder="0" required></div>
                </div>
                <div class="form-grid">
                    <div class="field-group"><label>📊 FFO (%)</label><input type="number" id="ffo" step="any" placeholder="e.g., 96.5" required></div>
                </div>
                <div class="card-header" style="margin-top: 0.5rem;"><h3 style="font-size: 0.9rem;">⏱️ Time Metrics (HH:MM:SS)</h3></div>
                <div class="field-group"><label>🕒 OTI (Order → Invoice)</label>
                    <div class="inline-time">
                        <input type="number" id="otiH" placeholder="H" min="0">
                        <input type="number" id="otiM" placeholder="M" min="0" max="59">
                        <input type="number" id="otiS" placeholder="S" min="0" max="59" required>
                    </div>
                </div>
                <div class="field-group"><label>🕒 ITR (Invoice → Rider)</label>
                    <div class="inline-time">
                        <input type="number" id="itrH" placeholder="H" min="0">
                        <input type="number" id="itrM" placeholder="M" min="0" max="59">
                        <input type="number" id="itrS" placeholder="S" min="0" max="59" required>
                    </div>
                </div>
                <div class="field-group"><label>🕒 OTD (Order → Delivery)</label>
                    <div class="inline-time">
                        <input type="number" id="otdH" placeholder="H" min="0">
                        <input type="number" id="otdM" placeholder="M" min="0" max="59">
                        <input type="number" id="otdS" placeholder="S" min="0" max="59" required>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn-submit" disabled>✓ SUBMIT</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD TAB -->
    <div id="dashTab" class="tab-content">
        <!-- Slot bar: date picker always visible, slot navigation hidden for store view -->
        <div id="slotBarContainer" class="slot-bar">
            <input type="date" id="dateSelect" class="date-input">
            <div class="slot-divider"></div>
            <div id="slotNavWrapper" style="display: flex; align-items: center; gap: 16px;">
                <button class="nav-arrow" id="prevSlotBtn">←</button>
                <span class="slot-label" id="slotRangeLabel">—</span>
                <button class="nav-arrow" id="nextSlotBtn">→</button>
            </div>
        </div>
        <div id="kpiGrid" class="kpi-row"><div class="loader"><div class="spinner"></div> loading KPIs...</div></div>
        <!-- Store filter -->
        <div class="table-controls" style="margin-bottom: 12px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <label for="storeFilterSelect" style="font-weight: 700; font-size: 0.85rem;">🏬 Store Filter:</label>
                <select id="storeFilterSelect" style="padding: 8px 16px; border-radius: 40px; border: 1px solid var(--border); font-weight: 600;">
                    <option value="all">All Stores</option>
                </select>
            </div>
            <label class="filter-toggle">
                <input type="checkbox" id="pendingFilterToggle">
                Show Pending Only
            </label>
        </div>
        <div class="table-wrapper" id="dashboardTableWrapper">
            <table class="data-table" id="storeTable">
                <thead id="storeTableHead"></thead>
                <tbody id="tableBody"><tr><td colspan="8"><div class="loader"><div class="spinner"></div> Syncing data...</div></td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- DAILY TRACKER TAB -->
    <div id="dailyTab" class="tab-content">
        <div class="slot-bar" style="justify-content: space-between;">
            <div style="display: flex; gap: 16px; align-items: center;">
                <input type="date" id="dailyDateSelect" class="date-input">
                <h4 style="color: var(--text-soft); font-size: 0.9rem; font-weight: 800;">All-Day Completion Matrix</h4>
            </div>
            <label class="filter-toggle">
                <input type="checkbox" id="dailyPendingToggle">
                Show Incomplete Stores Only
            </label>
        </div>
        <div class="table-wrapper">
            <table class="data-table" id="dailyTable">
                <thead>
                    <tr>
                        <th>Store</th>
                        <th>10:00</th><th>12:00</th><th>16:00</th><th>18:00</th><th>20:00</th><th>22:00</th>
                    </tr>
                </thead>
                <tbody id="dailyTableBody">
                    <tr><td colspan="7"><div class="loader"><div class="spinner"></div> Syncing daily data...</div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div id="globalToast" class="toast-notify">✓ Report submitted</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyG9EJNzonUT15CrbhPtCZuYPdR0e86sVQa6fi82JjN6oBbDW56IVR5TlmjIq7NKJm8/exec";
    const STORES_LIST = [
        "TM6N","TM4T","TM6M","T9W3","T9T3","T9V5","T3GC","TM6O","T9T7",
        "TM4Z","TM3J","TM5C","TN1B","TK5T","TN1T","T9H8","TM8T","TN1C",
        "TBAE","U2JH","U1WR","U949","FRVE","U286","U1WP","2314","3035",
        "3087","F1ZP","U1L2","U14V","TNI6","U086","U1OW","TKM7"
    ];
    const SLOTS = [
        { hour: 10, label: '10:00 AM', startOffset: -10, endOffset: 20 },
        { hour: 12, label: '12:00 PM', startOffset: -10, endOffset: 20 },
        { hour: 16, label: '4:00 PM', startOffset: -10, endOffset: 20 },
        { hour: 18, label: '6:00 PM', startOffset: -10, endOffset: 20 },
        { hour: 20, label: '8:00 PM', startOffset: -10, endOffset: 20 },
        { hour: 22, label: '10:00 PM', startOffset: -10, endOffset: 20 }
    ];
    let currentSlotIdx = 0;

    // Dashboard state for silent polling
    let lastDashboardData = null;
    let dashboardPollingInterval = null;

    // Colour thresholds for time metrics (in seconds)
    const THRESHOLDS = {
        oti: 120,   // 2 minutes
        itr: 60,   // 1 minute
        otd: 600   // 10 minutes
    };

    // ========== HELPER: time check for form ==========
    function getCurrentActiveSlot() {
        const now = new Date();
        const minutes = now.getHours() * 60 + now.getMinutes();
        for (let i = 0; i < SLOTS.length; i++) {
            const start = SLOTS[i].hour * 60 + SLOTS[i].startOffset;
            const end = SLOTS[i].hour * 60 + SLOTS[i].endOffset;
            if (minutes >= start && minutes < end) return SLOTS[i];
        }
        return null;
    }

    function setDefaultDates() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const todayStr = `${yyyy}-${mm}-${dd}`;
        document.getElementById('dateSelect').value = todayStr;
        document.getElementById('dailyDateSelect').value = todayStr;
    }

    function setSlotByHour() {
        const now = new Date().getHours();
        let found = 0;
        for (let i = 0; i < SLOTS.length; i++) {
            if (now >= SLOTS[i].hour) found = i;
            else break;
        }
        currentSlotIdx = found;
    }

    // ========== FORM SUBMISSION WINDOW MANAGEMENT ==========
    function updateFormWindowUI() {
        const slot = getCurrentActiveSlot();
        const badge = document.getElementById('windowBadge');
        const msg = document.getElementById('submissionMessage');
        const submitBtn = document.getElementById('submitBtn');
        if (slot) {
            const startMin = slot.hour * 60 + slot.startOffset;
            const endMin = slot.hour * 60 + slot.endOffset;
            const startStr = `${String(Math.floor(startMin/60)).padStart(2,'0')}:${String(startMin%60).padStart(2,'0')}`;
            const endStr = `${String(Math.floor(endMin/60)).padStart(2,'0')}:${String(endMin%60).padStart(2,'0')}`;
            badge.textContent = `🟢 Open: ${startStr}–${endStr}`;
            badge.style.background = '#dcfce7';
            badge.style.color = '#166534';
            msg.textContent = '';
            submitBtn.disabled = false;
        } else {
            badge.textContent = '⏳ Closed';
            badge.style.background = '#fee2e2';
            badge.style.color = '#991b1b';
            msg.textContent = 'Submissions only allowed during slot windows: 9:50–10:20, 11:50–12:20, 15:50–16:20, 17:50–18:20, 19:50–20:20, 21:50–22:20';
            submitBtn.disabled = true;
        }
    }

    // ========== API FETCH WRAPPERS ==========
    async function fetchDashboard(date, slotIdx, store = null) {
        let url = `${API_URL}?action=dashboard&date=${date}&slot=${slotIdx}`;
        if (store && store !== 'all') url += `&store=${store}`;
        const resp = await fetch(url);
        return await resp.json();
    }

    async function fetchDailyTracker(date, pendingOnly = false) {
        let url = `${API_URL}?action=dailyTracker&date=${date}&pendingOnly=${pendingOnly}`;
        const resp = await fetch(url);
        return await resp.json();
    }

    // ========== TOGGLE SLOT NAV VISIBILITY ==========
    function toggleSlotBarVisibility() {
        const storeFilter = document.getElementById('storeFilterSelect').value;
        const slotNav = document.getElementById('slotNavWrapper');
        if (storeFilter === 'all') {
            slotNav.style.display = 'flex';
        } else {
            slotNav.style.display = 'none';
        }
    }

    // ========== COLOUR HELPERS ==========
    function getTimeClass(formattedTime, type) {
        if (!formattedTime) return '';
        const parts = formattedTime.split(':');
        if (parts.length !== 3) return '';
        const seconds = (+parts[0]) * 3600 + (+parts[1]) * 60 + (+parts[2]);
        if (type === 'oti' || type === 'itr' || type === 'otd') {
            return seconds < THRESHOLDS[type] ? 'good' : 'bad';
        }
        return '';
    }

    // ========== RENDER DASHBOARD (with silent option) ==========
    async function renderDashboard(silent = false) {
        if (!document.getElementById('dashTab').classList.contains('active')) return;
        const date = document.getElementById('dateSelect').value;
        const storeFilter = document.getElementById('storeFilterSelect').value;
        const pendingOnly = document.getElementById('pendingFilterToggle').checked;

        toggleSlotBarVisibility();

        if (!silent) {
            document.getElementById('kpiGrid').innerHTML = '<div class="loader"><div class="spinner"></div> refreshing KPIs...</div>';
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="8"><div class="loader"><div class="spinner"></div> loading stores...</div></td></tr>';
        }

        try {
            const data = await fetchDashboard(date, currentSlotIdx, storeFilter === 'all' ? null : storeFilter);
            // For silent refresh, compare with last fetched data to avoid DOM changes if identical
            if (silent) {
                const newDataStr = JSON.stringify(data);
                if (lastDashboardData === newDataStr) {
                    return; // No change, skip rendering completely
                }
                lastDashboardData = newDataStr;
            } else {
                lastDashboardData = JSON.stringify(data);
            }

            if (storeFilter === 'all') {
                // Global slot view
                const kpis = data.kpis;
                const pendingCount = STORES_LIST.length - data.stores.filter(s => s.total_orders != null).length;
                document.getElementById('kpiGrid').innerHTML = [
                    { label: "Pending Stores", value: pendingCount, cls: pendingCount > 0 ? 'bad' : 'good' },
                    { label: "Total Orders", value: kpis.totalOrders || 0, cls: '' },
                    { label: "Open Orders", value: kpis.openOrders || 0, cls: '' },
                    { label: "Cancelled", value: kpis.cancelledOrders || 0, cls: '' },
                    { label: "Avg FFO", value: kpis.avgFfo != null ? kpis.avgFfo.toFixed(1)+"%" : "", cls: kpis.avgFfo != null ? (kpis.avgFfo > 95 ? 'good' : (kpis.avgFfo < 85 ? 'bad' : '')) : '' },
                    { label: "Avg OTI", value: kpis.avgOti || "", cls: getTimeClass(kpis.avgOti, 'oti') },
                    { label: "Avg ITR", value: kpis.avgItr || "", cls: getTimeClass(kpis.avgItr, 'itr') },
                    { label: "Avg OTD", value: kpis.avgOtd || "", cls: getTimeClass(kpis.avgOtd, 'otd') }
                ].map(k => `<div class="kpi-card"><div class="kpi-label">${k.label}</div><div class="kpi-val ${k.cls}">${k.value}</div></div>`).join('');

                document.getElementById('storeTableHead').innerHTML = '<tr><th>Store</th><th>Total</th><th>Open</th><th>Cancel</th><th>FFO %</th><th>OTI</th><th>ITR</th><th>OTD</th></tr>';
                let stores = data.stores;
                if (pendingOnly) stores = stores.filter(s => s.total_orders == null);
                const rowsHtml = stores.map(s => {
                    const ffoDisplay = s.ffo != null ? s.ffo.toFixed(1)+"%" : "";
                    const otiDisplay = s.oti || "";
                    const itrDisplay = s.itr || "";
                    const otdDisplay = s.otd || "";
                    const ffoClass = s.ffo != null ? (s.ffo > 95 ? 'good' : (s.ffo < 85 ? 'bad' : '')) : '';
                    const otiClass = getTimeClass(otiDisplay, 'oti');
                    const itrClass = getTimeClass(itrDisplay, 'itr');
                    const otdClass = getTimeClass(otdDisplay, 'otd');
                    return `<tr>
                        <td><span class="badge-store">${s.store}</span></td>
                        <td>${s.total_orders != null ? s.total_orders : ''}</td>
                        <td>${s.open_orders != null ? s.open_orders : ''}</td>
                        <td>${s.cancelled_orders != null ? s.cancelled_orders : ''}</td>
                        <td class="${ffoClass}">${ffoDisplay}</td>
                        <td class="${otiClass}">${otiDisplay}</td>
                        <td class="${itrClass}">${itrDisplay}</td>
                        <td class="${otdClass}">${otdDisplay}</td>
                    </tr>`;
                }).join('');
                document.getElementById('tableBody').innerHTML = rowsHtml || '<tr><td colspan="8" style="padding:30px;color:var(--success)">🎉 All stores have submitted for this slot!</td></tr>';
            } else {
                // Store‑specific breakdown
                document.getElementById('kpiGrid').innerHTML = `<div class="kpi-card" style="grid-column:span 4"><div class="kpi-label">Store</div><div class="kpi-val" style="font-size:1.4rem">${data.store}</div></div>`;
                document.getElementById('storeTableHead').innerHTML = '<tr><th>Slot</th><th>Total</th><th>Open</th><th>Cancel</th><th>FFO %</th><th>OTI</th><th>ITR</th><th>OTD</th></tr>';
                const rowsHtml = data.slots.map(s => {
                    const ffoDisplay = s.ffo != null ? s.ffo.toFixed(1)+"%" : "";
                    const otiDisplay = s.oti || "";
                    const itrDisplay = s.itr || "";
                    const otdDisplay = s.otd || "";
                    const ffoClass = s.ffo != null ? (s.ffo > 95 ? 'good' : (s.ffo < 85 ? 'bad' : '')) : '';
                    const otiClass = getTimeClass(otiDisplay, 'oti');
                    const itrClass = getTimeClass(itrDisplay, 'itr');
                    const otdClass = getTimeClass(otdDisplay, 'otd');
                    return `<tr>
                        <td><span class="badge-store">${s.slotLabel}</span></td>
                        <td>${s.total_orders != null ? s.total_orders : ''}</td>
                        <td>${s.open_orders != null ? s.open_orders : ''}</td>
                        <td>${s.cancelled_orders != null ? s.cancelled_orders : ''}</td>
                        <td class="${ffoClass}">${ffoDisplay}</td>
                        <td class="${otiClass}">${otiDisplay}</td>
                        <td class="${itrClass}">${itrDisplay}</td>
                        <td class="${otdClass}">${otdDisplay}</td>
                    </tr>`;
                }).join('');
                document.getElementById('tableBody').innerHTML = rowsHtml || '<tr><td colspan="8" style="padding:30px;color:var(--text-soft)">No data for this store yet.</td></tr>';
            }
        } catch (err) {
            console.error(err);
            if (!silent) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="8">Error loading data</td></tr>';
            }
        }
    }

    // ========== RENDER DAILY TRACKER ==========
    async function renderDailyTracker() {
        if (!document.getElementById('dailyTab').classList.contains('active')) return;
        const date = document.getElementById('dailyDateSelect').value;
        const pendingOnly = document.getElementById('dailyPendingToggle').checked;
        document.getElementById('dailyTableBody').innerHTML = '<tr><td colspan="7"><div class="loader"><div class="spinner"></div> syncing daily data...</div></td></tr>';
        try {
            const data = await fetchDailyTracker(date, pendingOnly);
            const rowsHtml = data.map(r => {
                const cells = r.slots.map(val => `<td><span class="status-icon">${val ? '✅' : '❌'}</span></td>`).join('');
                return `<tr><td><span class="badge-store">${r.store}</span></td>${cells}</tr>`;
            }).join('');
            document.getElementById('dailyTableBody').innerHTML = rowsHtml || '<tr><td colspan="7" style="padding:30px;color:var(--success)">🎉 All stores are perfectly up-to-date!</td></tr>';
        } catch (err) {
            document.getElementById('dailyTableBody').innerHTML = '<tr><td colspan="7">Error loading daily data</td></tr>';
        }
    }

    // ========== SILENT AUTO‑REFRESH FOR DASHBOARD ==========
    function startDashboardPolling() {
        stopDashboardPolling();
        dashboardPollingInterval = setInterval(() => {
            if (document.getElementById('dashTab').classList.contains('active')) {
                renderDashboard(true); // silent refresh
            }
        }, 30000);
    }

    function stopDashboardPolling() {
        if (dashboardPollingInterval) {
            clearInterval(dashboardPollingInterval);
            dashboardPollingInterval = null;
        }
    }

    // ========== SLOT NAVIGATION ==========
    function updateSlotUI() {
        document.getElementById('slotRangeLabel').innerText = SLOTS[currentSlotIdx].label;
        document.getElementById('prevSlotBtn').disabled = currentSlotIdx === 0;
        document.getElementById('nextSlotBtn').disabled = currentSlotIdx === SLOTS.length - 1;
    }

    // ========== FORM SUBMISSION ==========
    async function submitMetrics(e) {
        e.preventDefault();
        const store = document.getElementById('storeSelect').value;
        if (!store) return alert("Select a store.");
        const total_orders = parseInt(document.getElementById('totalOrders').value) || null;
        const open_orders = parseInt(document.getElementById('openOrders').value) || null;
        const cancelled_orders = parseInt(document.getElementById('cancelledOrders').value) || null;
        const ffo = parseFloat(document.getElementById('ffo').value) || null;
        const oti = (parseInt(document.getElementById('otiH').value)||0)*3600 + (parseInt(document.getElementById('otiM').value)||0)*60 + (parseInt(document.getElementById('otiS').value)||0) || null;
        const itr = (parseInt(document.getElementById('itrH').value)||0)*3600 + (parseInt(document.getElementById('itrM').value)||0)*60 + (parseInt(document.getElementById('itrS').value)||0) || null;
        const otd = (parseInt(document.getElementById('otdH').value)||0)*3600 + (parseInt(document.getElementById('otdM').value)||0)*60 + (parseInt(document.getElementById('otdS').value)||0) || null;
        const payload = { store, total_orders, open_orders, cancelled_orders, ffo, oti, itr, otd };
        try {
            const resp = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            if (!resp.ok) throw new Error();
            const json = await resp.json();
            if (json.status === 'error') {
                alert(json.message);
                return;
            }
            document.getElementById('globalToast').classList.add('show');
            setTimeout(() => document.getElementById('globalToast').classList.remove('show'), 3000);
            document.getElementById('metricsForm').reset();
            // Refresh open tabs instantly
            if (document.getElementById('dashTab').classList.contains('active')) {
                lastDashboardData = null;
                renderDashboard(false);
            }
            if (document.getElementById('dailyTab').classList.contains('active')) renderDailyTracker();
        } catch (err) {
            alert("Submission error. Check console.");
        }
    }

    // ========== TAB SETUP ==========
    function setupTabs() {
        const formBtn = document.getElementById('tabFormBtn');
        const dashBtn = document.getElementById('tabDashBtn');
        const dailyBtn = document.getElementById('tabDailyBtn');
        const formTab = document.getElementById('formTab');
        const dashTab = document.getElementById('dashTab');
        const dailyTab = document.getElementById('dailyTab');
        function clear() {
            [formBtn, dashBtn, dailyBtn].forEach(b => b.classList.remove('active'));
            [formTab, dashTab, dailyTab].forEach(t => t.classList.remove('active'));
        }
        formBtn.onclick = () => { 
            clear(); 
            formBtn.classList.add('active'); 
            formTab.classList.add('active'); 
            updateFormWindowUI(); 
            stopDashboardPolling();
        };
        dashBtn.onclick = () => { 
            clear(); 
            dashBtn.classList.add('active'); 
            dashTab.classList.add('active'); 
            renderDashboard(false); 
            startDashboardPolling();
        };
        dailyBtn.onclick = () => { 
            clear(); 
            dailyBtn.classList.add('active'); 
            dailyTab.classList.add('active'); 
            renderDailyTracker(); 
            stopDashboardPolling();
        };
    }

    // ========== INITIALIZATION ==========
    async function init() {
        setDefaultDates();
        setSlotByHour();
        updateSlotUI();

        const storeFilter = document.getElementById('storeFilterSelect');
        STORES_LIST.forEach(code => {
            const opt = document.createElement('option');
            opt.value = code;
            opt.textContent = code;
            storeFilter.appendChild(opt);
        });

        setupTabs();

        document.getElementById('metricsForm').addEventListener('submit', submitMetrics);
        document.getElementById('dateSelect').addEventListener('change', () => { lastDashboardData = null; renderDashboard(false); });
        document.getElementById('pendingFilterToggle').addEventListener('change', () => { lastDashboardData = null; renderDashboard(false); });
        document.getElementById('storeFilterSelect').addEventListener('change', () => {
            lastDashboardData = null;
            toggleSlotBarVisibility();
            renderDashboard(false);
        });
        document.getElementById('dailyDateSelect').addEventListener('change', renderDailyTracker);
        document.getElementById('dailyPendingToggle').addEventListener('change', renderDailyTracker);
        document.getElementById('prevSlotBtn').onclick = () => { if (currentSlotIdx > 0) { currentSlotIdx--; updateSlotUI(); lastDashboardData = null; renderDashboard(false); } };
        document.getElementById('nextSlotBtn').onclick = () => { if (currentSlotIdx < SLOTS.length-1) { currentSlotIdx++; updateSlotUI(); lastDashboardData = null; renderDashboard(false); } };

        updateFormWindowUI();
        setInterval(updateFormWindowUI, 60000);
    }

    init();
</script>
</body>
